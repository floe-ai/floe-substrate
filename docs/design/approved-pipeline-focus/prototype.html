<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floe Pipeline Focus Prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --pf-bg: #0a0c0e;
      --pf-panel: #121518;
      --pf-panel-strong: #181c20;
      --pf-panel-soft: #20252a;
      --pf-text: #f0f2ef;
      --pf-muted: #9aa39d;
      --pf-border: #30373a;
      --pf-grid: rgba(226, 236, 230, .055);
      --pf-event: #b39bd8;
      --pf-event-soft: #292233;
      --pf-context: #91b9a5;
      --pf-context-soft: #1e3028;
      --pf-artifact: #d5ae73;
      --pf-artifact-soft: #332a1d;
      --pf-shadow: rgba(0, 0, 0, .42);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--pf-bg); color: var(--pf-text); }
    button, textarea { font: inherit; }
    button { color: inherit; }
    .pf-app { min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .pf-topbar {
      min-height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 18px;
      padding: 10px 18px; background: #0e1012; border-bottom: 1px solid var(--pf-border);
    }
    .pf-brand-row, .pf-status, .pf-legend, .pf-actor-chip, .pf-card-meta { display: flex; align-items: center; }
    .pf-brand-row { gap: 10px; min-width: 0; }
    .pf-brand { display: grid; place-items: center; flex: 0 0 auto; width: 34px; height: 34px; border-radius: 9px; background: var(--pf-context); color: #0c1712; font-weight: 700; }
    .pf-workspace { color: var(--pf-muted); white-space: nowrap; }
    .pf-separator { color: #59615c; }
    .pf-scope { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .pf-status { gap: 8px; color: var(--pf-muted); font-size: 12px; text-align: right; }
    .pf-status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pf-artifact); }

    .pf-nav {
      min-height: 54px; display: flex; align-items: center; justify-content: space-between; gap: 18px;
      padding: 8px 18px; background: var(--pf-panel); border-bottom: 1px solid var(--pf-border);
    }
    .pf-breadcrumb { display: flex; align-items: center; min-width: 0; gap: 5px; overflow-x: auto; scrollbar-width: none; }
    .pf-breadcrumb::-webkit-scrollbar { display: none; }
    .pf-crumb { appearance: none; flex: 0 0 auto; border: 0; border-radius: 7px; padding: 7px 8px; background: transparent; color: var(--pf-muted); cursor: pointer; }
    .pf-crumb[aria-current="page"] { color: var(--pf-text); background: var(--pf-context-soft); }
    .pf-crumb-separator { color: #59615c; }
    .pf-legend { gap: 12px; flex: 0 0 auto; color: var(--pf-muted); font-size: 11px; }
    .pf-key { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .pf-key::before { content: ""; width: 8px; height: 8px; border-radius: 3px; background: var(--pf-event); }
    .pf-key.context::before { background: var(--pf-context); }
    .pf-key.artifact::before { background: var(--pf-artifact); }

    .pf-workarea { flex: 1; min-height: 0; display: flex; overflow: hidden; }
    .pf-canvas-shell { min-width: 0; flex: 1; transition: margin-right .2s ease; }
    .pf-canvas-shell.panel-open { margin-right: 390px; }
    .pf-canvas {
      position: relative; min-height: calc(100vh - 116px); padding: 38px 28px 50px;
      background-color: var(--pf-bg); background-image: radial-gradient(circle, var(--pf-grid) 1px, transparent 1px); background-size: 22px 22px;
    }
    .pf-stage-label { width: min(100%, 1540px); margin: 0 auto 12px; color: var(--pf-muted); font-size: 12px; }
    .pf-layout {
      position: relative; z-index: 2; width: min(100%, 1540px); margin: 0 auto; display: grid;
      grid-template-columns: minmax(170px, .58fr) minmax(330px, 1.22fr) minmax(250px, 1fr);
      align-items: center; gap: 58px; min-height: 540px;
    }
    .pf-layout.source-view { grid-template-columns: minmax(60px, .35fr) minmax(330px, 1.18fr) minmax(230px, .8fr); }
    .pf-layout.branch-view { align-items: start; }
    .pf-layout.branch-view .pf-upstream,
    .pf-layout.branch-view .pf-focus { margin-top: 38px; }
    .pf-lines { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
    .pf-line { fill: none; stroke: var(--pf-context); stroke-width: 2.2; stroke-linecap: round; opacity: .8; }
    .pf-edge-label {
      position: absolute; z-index: 3; display: none; transform: translate(-50%, -50%); padding: 4px 7px;
      border-radius: 6px; background: var(--pf-bg); color: var(--pf-context); font-size: 11px; white-space: nowrap; pointer-events: none;
    }
    .pf-edge-label.visible { display: block; }

    .pf-node {
      position: relative; min-width: 0; border: 1px solid var(--pf-border); border-radius: 12px;
      background: var(--pf-panel-strong); color: var(--pf-text); box-shadow: 0 14px 34px var(--pf-shadow); overflow: hidden;
    }
    button.pf-node { width: 100%; padding: 0; text-align: left; cursor: pointer; }
    .pf-node.focus { border-color: color-mix(in srgb, var(--pf-context) 66%, var(--pf-border)); box-shadow: 0 0 0 2px var(--pf-context-soft), 0 18px 40px var(--pf-shadow); }
    .pf-node.event { border-color: color-mix(in srgb, var(--pf-event) 62%, var(--pf-border)); }
    .pf-node-image { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--pf-panel); }
    .pf-node-body { display: block; padding: 14px; }
    .pf-kind { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; color: var(--pf-context); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; }
    .pf-kind::before { content: ""; width: 8px; height: 8px; border-radius: 3px; background: currentColor; }
    .pf-node.event .pf-kind { color: var(--pf-event); }
    .pf-title { display: block; font-size: 18px; line-height: 1.25; font-weight: 600; }
    .pf-subtitle { display: block; margin-top: 5px; color: var(--pf-muted); font-size: 12px; line-height: 1.4; }
    .pf-actor-chip { width: fit-content; gap: 6px; margin-top: 11px; padding: 5px 8px; border-radius: 6px; background: var(--pf-context-soft); color: var(--pf-context); font-size: 11px; }
    .pf-actor-chip::before { content: "A"; display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid currentColor; font-size: 9px; }
    .pf-section { display: block; margin-top: 13px; }
    .pf-section-label { display: block; margin-bottom: 7px; color: var(--pf-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    .pf-files { display: grid; gap: 6px; }
    .pf-file { display: flex; align-items: center; gap: 7px; min-width: 0; padding: 8px 9px; border-radius: 7px; background: var(--pf-panel); font-size: 12px; }
    .pf-file::before { content: "▧"; flex: 0 0 auto; color: var(--pf-artifact); }
    .pf-file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pf-card-meta { margin-top: 14px; padding-top: 11px; justify-content: space-between; gap: 9px; border-top: 1px solid var(--pf-border); color: var(--pf-muted); font-size: 11px; }
    .pf-context-action { appearance: none; border: 0; background: transparent; padding: 5px 0; color: var(--pf-artifact); cursor: pointer; text-align: left; }
    .pf-context-action:hover { text-decoration: underline; }
    .pf-port { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: var(--pf-context); border: 3px solid var(--pf-panel-strong); transform: translateY(-50%); }
    .pf-port.in { left: -7px; }
    .pf-port.out { right: -7px; }

    .pf-upstream { grid-column: 1; }
    .pf-focus { grid-column: 2; }
    .pf-next-layer { grid-column: 3; min-width: 0; display: grid; gap: 9px; align-content: center; }
    .pf-next-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; color: var(--pf-muted); font-size: 12px; }
    .pf-next-heading strong { color: var(--pf-text); font-weight: 500; }
    .pf-next-card {
      position: relative; appearance: none; width: 100%; min-width: 0; display: grid; grid-template-columns: 80px minmax(0, 1fr);
      gap: 10px; align-items: center; padding: 9px; border: 1px solid var(--pf-border); border-radius: 10px;
      background: var(--pf-panel-strong); color: var(--pf-text); text-align: left; cursor: pointer;
    }
    .pf-next-card.single { grid-template-columns: 1fr; min-height: 124px; padding: 14px; border-color: color-mix(in srgb, var(--pf-context) 52%, var(--pf-border)); background: var(--pf-context-soft); }
    .pf-next-card:hover { border-color: var(--pf-context); }
    .pf-next-card img { display: block; width: 80px; aspect-ratio: 4 / 3; border-radius: 6px; object-fit: cover; background: var(--pf-panel); }
    .pf-next-copy { min-width: 0; }
    .pf-next-kind { display: block; margin-bottom: 4px; color: var(--pf-context); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
    .pf-next-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 600; }
    .pf-next-meta { display: block; margin-top: 4px; color: var(--pf-muted); font-size: 11px; line-height: 1.3; }
    .pf-next-arrow { display: block; margin-top: 8px; color: var(--pf-context); }
    .pf-branch-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .pf-branch-grid .pf-next-card { display: block; padding: 0; overflow: hidden; }
    .pf-branch-grid .pf-next-card img { width: 100%; aspect-ratio: 4 / 3; border-radius: 0; }
    .pf-branch-grid .pf-next-copy { display: block; padding: 8px; }
    .pf-branch-grid .pf-next-title { font-size: 11px; }

    .pf-sheet-picker { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
    .pf-sheet-choice { appearance: none; min-width: 0; padding: 0; overflow: hidden; border: 1px solid var(--pf-border); border-radius: 8px; background: var(--pf-panel); color: var(--pf-text); text-align: left; cursor: pointer; }
    .pf-sheet-choice[aria-pressed="true"] { border-color: var(--pf-artifact); box-shadow: 0 0 0 2px var(--pf-artifact-soft); }
    .pf-sheet-choice img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
    .pf-sheet-choice span { display: block; padding: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--pf-muted); font-size: 10px; }
    .pf-input-preview { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 11px; align-items: center; padding: 9px; border-radius: 8px; background: var(--pf-panel); }
    .pf-input-preview img { display: block; width: 128px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; }
    .pf-pending { padding: 10px; border-radius: 8px; background: var(--pf-artifact-soft); color: var(--pf-artifact); font-size: 12px; }
    .pf-empty-upstream { grid-column: 1; }
    .pf-end-state { color: var(--pf-muted); font-size: 12px; line-height: 1.45; }
    .pf-proposal-note { width: min(100%, 1540px); margin: 18px auto 0; color: var(--pf-muted); font-size: 11px; }

    .pf-panel {
      position: fixed; z-index: 20; top: 116px; right: 0; bottom: 0; width: 390px; display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto; background: var(--pf-panel); border-left: 1px solid var(--pf-border);
      box-shadow: -18px 0 38px var(--pf-shadow); transform: translateX(100%); transition: transform .2s ease;
    }
    .pf-panel[hidden] { display: none; }
    .pf-panel.open { transform: translateX(0); }
    .pf-panel-header { padding: 14px 15px; border-bottom: 1px solid var(--pf-border); }
    .pf-panel-heading { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
    .pf-panel-heading h2 { margin: 0 0 5px; font-size: 17px; font-weight: 600; }
    .pf-panel-heading p { margin: 0; color: var(--pf-muted); font-size: 12px; line-height: 1.4; }
    .pf-close { appearance: none; border: 0; background: transparent; color: var(--pf-muted); padding: 5px 7px; cursor: pointer; }
    .pf-stream { min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .pf-message { max-width: 88%; padding: 10px 11px; border-radius: 9px; background: var(--pf-panel-strong); border: 1px solid var(--pf-border); }
    .pf-message.operator { align-self: flex-end; background: var(--pf-context-soft); border-color: var(--pf-context); }
    .pf-message span { display: block; margin-bottom: 4px; color: var(--pf-muted); font-size: 11px; }
    .pf-message p { margin: 0; font-size: 13px; line-height: 1.42; white-space: pre-wrap; overflow-wrap: anywhere; }
    .pf-composer { padding: 12px; border-top: 1px solid var(--pf-border); background: #0f1214; }
    .pf-composer label { display: block; margin-bottom: 7px; color: var(--pf-muted); font-size: 11px; }
    .pf-composer-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    .pf-composer textarea { min-height: 60px; resize: none; padding: 9px; border: 1px solid var(--pf-border); border-radius: 8px; background: var(--pf-panel-strong); color: var(--pf-text); }
    .pf-send { appearance: none; border: 1px solid var(--pf-context); border-radius: 8px; background: var(--pf-context-soft); padding: 0 12px; cursor: pointer; }
    .pf-prototype-label { display: block; margin-top: 6px; color: var(--pf-muted); font-size: 10px; }
    .pf-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    @media (max-width: 1180px) {
      .pf-canvas-shell.panel-open { margin-right: 0; }
      .pf-panel { width: min(390px, 94vw); }
      .pf-layout, .pf-layout.source-view { grid-template-columns: minmax(145px, .54fr) minmax(290px, 1.12fr) minmax(225px, .9fr); gap: 38px; }
      .pf-canvas { padding-left: 18px; padding-right: 18px; }
      .pf-branch-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 800px) {
      .pf-layout, .pf-layout.source-view { width: min(100%, 560px); grid-template-columns: minmax(0, 1fr); gap: 44px; min-height: 0; }
      .pf-upstream, .pf-focus, .pf-next-layer, .pf-empty-upstream { grid-column: 1; width: 100%; }
      .pf-upstream { max-width: 260px; justify-self: center; }
      .pf-next-layer { max-width: 520px; justify-self: center; }
      .pf-canvas { padding-top: 26px; }
      .pf-edge-label { background: var(--pf-bg); }
    }
    @media (max-width: 560px) {
      .pf-topbar { align-items: flex-start; padding-left: 12px; padding-right: 12px; }
      .pf-workspace, .pf-topbar .pf-separator { display: none; }
      .pf-scope { white-space: normal; line-height: 1.25; }
      .pf-status { max-width: 140px; }
      .pf-nav { align-items: flex-start; padding-left: 12px; padding-right: 12px; }
      .pf-legend { display: none; }
      .pf-canvas { padding: 22px 12px 40px; }
      .pf-branch-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .pf-panel { top: 0; left: 0; width: 100%; }
      .pf-composer-row { grid-template-columns: 1fr; }
      .pf-send { min-height: 42px; }
      .pf-input-preview { grid-template-columns: 96px minmax(0, 1fr); }
      .pf-input-preview img { width: 96px; }
    }
    @media (max-width: 360px) {
      .pf-sheet-picker { grid-template-columns: 1fr; }
      .pf-sheet-choice { display: grid; grid-template-columns: 92px minmax(0, 1fr); align-items: center; }
      .pf-sheet-choice img { width: 92px; }
      .pf-branch-grid { grid-template-columns: 1fr; }
      .pf-branch-grid .pf-next-card { display: grid; grid-template-columns: 92px minmax(0, 1fr); }
      .pf-branch-grid .pf-next-card img { width: 92px; }
    }
    @media (prefers-reduced-motion: reduce) { .pf-canvas-shell, .pf-panel { transition: none; } }
  </style>
</head>

          <span class="pf-section"><span class="pf-section-label">Input</span>${files([data.registryContext.input])}</span>
          <span class="pf-section"><span class="pf-section-label">Current outputs</span>${files(data.registryContext.outputs)}</span>
          <span class="pf-card-meta">${interactive ? '<span>Open this step</span>' : contextAction('registry')}<span>${data.registryContext.componentCount} components</span></span></span>${port('out')}</${tag}>`;
      }

      function contactNode(classes, interactive = false) {
        const tag = interactive ? 'button' : 'article';
        const attrs = interactive ? 'type="button" data-view="contact"' : '';
        const picker = interactive ? '' : `<span class="pf-section"><span class="pf-section-label">Current output artifacts · choose a branch</span><span class="pf-sheet-picker">${data.propGroups.map(group => `<button type="button" class="pf-sheet-choice" data-sheet="${group.sheetIndex}" aria-pressed="${group.sheetIndex === state.sheetIndex}"><img src="${group.image}" alt="${escapeHtml(group.name)}"><span>${escapeHtml(group.artifactName)} · ${group.items.length} tiles</span></button>`).join('')}</span></span>`;
        return `<${tag} ${attrs} class="pf-node ${classes}">${port('in')}<span class="pf-node-body"><span class="pf-kind">${data.proposal.label}</span><span class="pf-title">${escapeHtml(data.contactContext.title)} Context</span><span class="pf-subtitle">Groups the registry into current contact sheets and canonical tiles.</span>${actorChip(data.contactContext.actor)}
          <span class="pf-section"><span class="pf-section-label">Input</span>${files([data.contactContext.input])}</span>${picker}
          <span class="pf-card-meta">${interactive ? '<span>Open this step</span>' : contextAction('contact')}<span>${data.propGroups.length} sheets · ${data.propGroups.reduce((total, group) => total + group.items.length, 0)} tiles</span></span></span>${port('out')}</${tag}>`;
      }

      function propNode(classes) {
        const item = currentProp();
        return `<article class="pf-node ${classes}">${port('in')}<span class="pf-node-body"><span class="pf-kind">${data.proposal.label}</span><span class="pf-title">${escapeHtml(item.name)} Context</span><span class="pf-subtitle">One independently retryable prop-reference task.</span>${actorChip('Prop Reference Generator')}
          <span class="pf-section"><span class="pf-section-label">Input artifact</span><span class="pf-input-preview"><img src="${item.inputImage}" alt="${escapeHtml(item.name)} tile"><span><strong>${escapeHtml(item.inputName)}</strong><span class="pf-subtitle">${escapeHtml(item.id)} · ${escapeHtml(item.category)}</span></span></span></span>
          <span class="pf-section"><span class="pf-section-label">Current output</span><span class="pf-pending">${escapeHtml(item.outputState)}</span></span>
          <span class="pf-card-meta">${contextAction(`prop:${item.id}`)}<span>One tile in · one reference out</span></span></span></article>`;
      }

      function nextCard(kind, title, detail, view) {
        return `<button type="button" class="pf-next-card single" data-view="${view}">${port('in')}<span class="pf-next-copy"><span class="pf-next-kind">${escapeHtml(kind)}</span><span class="pf-title">${escapeHtml(title)}</span><span class="pf-next-meta">${escapeHtml(detail)}</span><span class="pf-next-arrow">Follow this relationship →</span></span></button>`;
      }

      function propBranches() {
        const group = currentGroup();
        return `<aside class="pf-next-layer" aria-label="Immediate child Contexts"><div class="pf-next-heading"><strong>Next layer</strong><span>${group.items.length} child Contexts from ${escapeHtml(group.name)}</span></div><div class="pf-branch-grid">${group.items.map(item => `<button type="button" class="pf-next-card" data-prop="${escapeHtml(item.id)}">${port('in')}<img src="${item.inputImage}" alt=""><span class="pf-next-copy"><span class="pf-next-kind">Proposed Context</span><span class="pf-next-title">${escapeHtml(item.name)}</span><span class="pf-next-meta">Input · ${escapeHtml(item.inputName)}</span></span></button>`).join('')}</div></aside>`;
      }

      function renderBreadcrumb() {
        const parts = [{ label: 'Source Event', view: 'source' }];
        if (state.view !== 'source') parts.push({ label: 'Registry Context', view: 'registry' });
        if (state.view === 'contact' || state.view === 'prop') parts.push({ label: 'Contact sheets Context', view: 'contact' });
        if (state.view === 'prop') parts.push({ label: `${currentProp().name} Context`, view: 'prop' });
        breadcrumb.innerHTML = parts.map((part, index) => `${index ? '<span class="pf-crumb-separator" aria-hidden="true">›</span>' : ''}<button type="button" class="pf-crumb" data-view="${part.view}" ${index === parts.length - 1 ? 'aria-current="page"' : ''}>${escapeHtml(part.label)}</button>`).join('');
      }

      function render() {
        renderBreadcrumb();
        layout.classList.toggle('source-view', state.view === 'source');
        layout.classList.toggle('branch-view', state.view === 'contact');
        if (state.view === 'source') {
          layout.innerHTML = `<span class="pf-empty-upstream"></span>${eventNode('pf-focus focus')}` + `<aside class="pf-next-layer">${nextCard('Proposed Context', 'Registry Context', `Receives ${data.sourceEvent.artifactName} and creates ${data.registryContext.outputs.length} current outputs`, 'registry')}</aside>`;
          root.querySelector('.pf-stage-label').textContent = 'Start with the Event. Reveal only the next pipeline step.';
          live.textContent = 'Source Event selected. One downstream Context is visible.';
        } else if (state.view === 'registry') {
          layout.innerHTML = `${eventNode('pf-upstream', true)}${registryNode('pf-focus focus')}` + `<aside class="pf-next-layer">${nextCard('Proposed child Context', 'Contact sheets Context', `Receives registry.json and registry.md together`, 'contact')}</aside>`;
          root.querySelector('.pf-stage-label').textContent = 'The source artifact is the Registry Context input. Its two outputs move downstream together.';
          live.textContent = 'Registry Context selected. Its immediate child Context is visible.';
        } else if (state.view === 'contact') {
          layout.innerHTML = `${registryNode('pf-upstream', true)}${contactNode('pf-focus focus')}${propBranches()}`;
          root.querySelector('.pf-stage-label').textContent = `The Contact sheets Context has three current output artifacts. ${currentGroup().name} reveals its nine child Contexts.`;
          live.textContent = `${currentGroup().name} selected. Nine immediate child Contexts are visible.`;
        } else {
          layout.innerHTML = `${contactNode('pf-upstream', true)}${propNode('pf-focus focus')}<aside class="pf-next-layer"><div class="pf-end-state"><strong>Current end of this branch</strong><br>The selected tile is the Context input. Its reference output is not current yet.</div></aside>`;
          root.querySelector('.pf-stage-label').textContent = 'One independently retryable prop task. Other prop Contexts remain in the previous layer.';
          live.textContent = `${currentProp().name} Context selected.`;
        }
        root.querySelector('.pf-proposal-note').textContent = `${data.proposal.label}: ${data.proposal.proposedContextCount} Contexts. The current live Scope still stores ${data.proposal.liveContextCount} Context, so this is the intended composition rather than a claim about live execution.`;
        renderPanel();
        window.requestAnimationFrame(drawConnections);
      }

      function contextDescriptor() {
        if (state.contextKey === 'registry') return { key: 'registry', title: 'Registry Context', actor: data.registryContext.actor, text: `The source image is the input. The current outputs are ${data.registryContext.outputs.join(' and ')}.` };
        if (state.contextKey === 'contact') return { key: 'contact', title: 'Contact sheets Context', actor: data.contactContext.actor, text: `${data.propGroups.length} current contact sheets contain ${data.propGroups.reduce((total, group) => total + group.items.length, 0)} canonical tiles.` };
        const item = currentProp();
        return { key: `prop:${item.id}`, title: `${item.name} Context`, actor: 'Prop Reference Generator', text: `${item.inputName} is the input artifact. The current reference output is pending.` };
      }

      function renderPanel() {
        panel.hidden = !state.panelOpen;
        panel.classList.toggle('open', state.panelOpen);
        shell.classList.toggle('panel-open', state.panelOpen);
        if (!state.panelOpen) return;
        const descriptor = contextDescriptor();
        root.querySelector('.pf-panel-heading h2').textContent = descriptor.title;
        root.querySelector('.pf-panel-heading p').textContent = `${descriptor.actor} · ${data.proposal.label}`;
        if (!state.messages[descriptor.key]) state.messages[descriptor.key] = [{ speaker: 'Floe', text: descriptor.text }];
        stream.innerHTML = state.messages[descriptor.key].map(message => `<article class="pf-message ${message.speaker === 'Operator' ? 'operator' : ''}"><span>${escapeHtml(message.speaker)}</span><p>${escapeHtml(message.text)}</p></article>`).join('');
        stream.scrollTop = stream.scrollHeight;
      }

      function point(element) {
        const canvasRect = canvas.getBoundingClientRect();
        const rect = element.getBoundingClientRect();
        return { x: rect.left + rect.width / 2 - canvasRect.left, y: rect.top + rect.height / 2 - canvasRect.top };
      }

      function curve(from, to) {
        const vertical = Math.abs(to.y - from.y) > Math.abs(to.x - from.x);
        if (vertical) {
          const bend = Math.max(34, Math.abs(to.y - from.y) * .42);
          return `M ${from.x} ${from.y} C ${from.x} ${from.y + bend}, ${to.x} ${to.y - bend}, ${to.x} ${to.y}`;
        }
        const bend = Math.max(42, Math.abs(to.x - from.x) * .42);
        return `M ${from.x} ${from.y} C ${from.x + bend} ${from.y}, ${to.x - bend} ${to.y}, ${to.x} ${to.y}`;
      }

      function positionLabel(label, from, targets, text) {
        if (!from || !targets.length) { label.classList.remove('visible'); return; }
        const average = targets.reduce((sum, target) => ({ x: sum.x + target.x, y: sum.y + target.y }), { x: 0, y: 0 });
        average.x /= targets.length; average.y /= targets.length;
        label.textContent = text;
        label.style.left = `${(from.x + average.x) / 2}px`;
        label.style.top = `${(from.y + average.y) / 2}px`;
        label.classList.add('visible');
      }

      function drawConnections() {
        lines.innerHTML = '';
        const upstream = layout.querySelector('.pf-upstream [data-port="out"]');
        const focusIn = layout.querySelector('.pf-focus [data-port="in"]');
        const focusOut = layout.querySelector('.pf-focus [data-port="out"]');
        const nextInputs = [...layout.querySelectorAll('.pf-next-layer [data-port="in"]')];
        const leftLabel = root.querySelector('.pf-left-label');
        const rightLabel = root.querySelector('.pf-right-label');
        if (upstream && focusIn) {
          const a = point(upstream); const b = point(focusIn);
          lines.insertAdjacentHTML('beforeend', `<path class="pf-line" d="${curve(a, b)}"></path>`);
          positionLabel(leftLabel, a, [b], state.view === 'registry' ? 'lands in' : 'creates child Context');
        } else leftLabel.classList.remove('visible');
        if (focusOut && nextInputs.length) {
          const a = point(focusOut); const targets = nextInputs.map(point);
          targets.forEach(target => lines.insertAdjacentHTML('beforeend', `<path class="pf-line" d="${curve(a, target)}"></path>`));
          const label = state.view === 'source' ? 'lands in' : state.view === 'contact' ? `creates ${targets.length} child Contexts` : 'creates child Context';
          positionLabel(rightLabel, a, targets, label);
        } else rightLabel.classList.remove('visible');
      }

      root.querySelector('.pf-workspace').textContent = data.workspace.name;
      root.querySelector('.pf-scope').textContent = data.scope.title;
      root.querySelector('.pf-status-text').textContent = `${data.proposal.label} · ${data.scope.status}`;

      root.addEventListener('click', event => {
        const sheet = event.target.closest('[data-sheet]');
        if (sheet) { state.sheetIndex = Number(sheet.dataset.sheet); state.propId = currentGroup().items[0].id; render(); return; }
        const prop = event.target.closest('[data-prop]');
        if (prop) { state.propId = prop.dataset.prop; state.view = 'prop'; render(); return; }
        const open = event.target.closest('[data-open-context]');
        if (open) { state.contextKey = open.dataset.openContext; state.panelOpen = true; renderPanel(); root.querySelector('#pf-message').focus(); return; }
        if (event.target.closest('.pf-close')) { state.panelOpen = false; renderPanel(); return; }
        const view = event.target.closest('[data-view]');
        if (view) { state.view = view.dataset.view; render(); }
      });

      root.querySelector('.pf-composer').addEventListener('submit', event => {
        event.preventDefault();
        const input = root.querySelector('#pf-message');
        const text = input.value.trim();
        if (!text) return;
        const descriptor = contextDescriptor();
        if (!state.messages[descriptor.key]) state.messages[descriptor.key] = [];
        state.messages[descriptor.key].push({ speaker: 'Operator', text });
        input.value = ''; renderPanel(); input.focus(); live.textContent = `Prototype message added to ${descriptor.title}.`;
      });

      const observer = new ResizeObserver(() => window.requestAnimationFrame(drawConnections));
      observer.observe(canvas);
      render();
    })();
  </script>
</body>
</html>
