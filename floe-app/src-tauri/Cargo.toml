[package]
name = "floe-console"
version = "0.1.80"
description = "Floe substrate console (Tauri shell)"
authors = ["floe"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
thiserror = "2"
serde_yaml = "0.9"
base64 = "0.22"
futures-util = "0.3"
rand = "0.8"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
urlencoding = "2.1"
floe-native-authority = { path = "../../floe-native-authority" }
