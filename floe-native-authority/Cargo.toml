[package]
name = "floe-native-authority"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[dependencies]
base64 = "0.22"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
rand = "0.8"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
urlencoding = "2.1"
zeroize = "1.8"

[[bin]]
name = "floe-authority-broker"
path = "src/main.rs"
